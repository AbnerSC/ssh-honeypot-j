<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="60%" stop-color="#0b1f33"/>
      <stop offset="100%" stop-color="#06121f"/>
    </radialGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="pupil" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 雷达扫描网格 -->
  <g stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.7">
    <circle cx="256" cy="216" r="150"/>
    <circle cx="256" cy="216" r="105"/>
    <circle cx="256" cy="216" r="60"/>
    <line x1="256" y1="56" x2="256" y2="376"/>
    <line x1="96" y1="216" x2="416" y2="216"/>
    <line x1="143" y1="103" x2="369" y2="329"/>
    <line x1="369" y1="103" x2="143" y2="329"/>
  </g>

  <!-- 扫描扇形 -->
  <path d="M256 216 L256 66 A150 150 0 0 1 368 110 Z" fill="#38bdf8" opacity="0.12"/>

  <!-- 眼睛 -->
  <g filter="url(#glow)">
    <!-- 眼眶 -->
    <path d="M96 216 Q256 86 416 216 Q256 346 96 216 Z" fill="#0c2a45" stroke="url(#ring)" stroke-width="10" stroke-linejoin="round"/>
    <!-- 虹膜 -->
    <circle cx="256" cy="216" r="72" fill="url(#iris)"/>
    <!-- 虹膜纹理 -->
    <g stroke="#bae6fd" stroke-width="2" opacity="0.55" fill="none">
      <circle cx="256" cy="216" r="56"/>
      <circle cx="256" cy="216" r="40"/>
    </g>
    <!-- 瞳孔 -->
    <circle cx="256" cy="216" r="30" fill="url(#pupil)"/>
    <!-- 瞳孔内雷达点 -->
    <circle cx="256" cy="216" r="6" fill="#7dd3fc"/>
    <!-- 高光 -->
    <circle cx="238" cy="196" r="10" fill="#ffffff" opacity="0.85"/>
    <circle cx="274" cy="236" r="5" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- 下方文字 -->
  <text x="256" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#e0f2fe" letter-spacing="4">NetGazer</text>
  <text x="256" y="478" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" fill="#7dd3fc" letter-spacing="10">网络凝视者</text>
</svg>
