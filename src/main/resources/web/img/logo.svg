<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="iris" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="pupil" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 雷达扫描网格 -->
  <g stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.7">
    <circle cx="60" cy="60" r="52"/>
    <circle cx="60" cy="60" r="36"/>
    <circle cx="60" cy="60" r="20"/>
    <line x1="60" y1="8" x2="60" y2="112"/>
    <line x1="8" y1="60" x2="112" y2="60"/>
    <line x1="23" y1="23" x2="97" y2="97"/>
    <line x1="97" y1="23" x2="23" y2="97"/>
  </g>

  <!-- 扫描扇形 -->
  <path d="M60 60 L60 8 A52 52 0 0 1 100 26 Z" fill="#38bdf8" opacity="0.14"/>

  <!-- 眼睛 -->
  <g filter="url(#glow)">
    <path d="M16 60 Q60 20 104 60 Q60 100 16 60 Z" fill="#0c2a45" stroke="url(#ring)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="25" fill="url(#iris)"/>
    <g stroke="#bae6fd" stroke-width="1.2" opacity="0.55" fill="none">
      <circle cx="60" cy="60" r="19"/>
      <circle cx="60" cy="60" r="13"/>
    </g>
    <circle cx="60" cy="60" r="10.5" fill="url(#pupil)"/>
    <circle cx="60" cy="60" r="2.2" fill="#7dd3fc"/>
    <circle cx="54" cy="54" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="66" cy="66" r="1.8" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
