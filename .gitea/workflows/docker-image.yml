# =====================================================================
# Gitea Actions：Docker 镜像构建并推送到自建 Nexus 仓库
# （仅 linux/amd64）
#
# 与 .github/workflows/docker-image.yml 分工：
#   - GitHub 侧工作流只会被 GitHub 读取，推送到 Docker Hub
#   - 本文件只会被 Gitea Actions 读取，推送到自建 Nexus
#
# 触发方式：
#   - 推送 release-v 开头的 tag（如 release-v1.2.3）自动构建，
#     推送 版本号（1.2.3）+ latest 标签
#   - 支持在 Actions 页面手动触发（需 Gitea >= 1.21）：
#     选择 release-v 开头的 tag 时同样推送 版本号 + latest，
#     选择分支时仅推送 latest
#
# 前置条件：
#   - 仓库 Settings -> Secrets 中配置：
#       NEXUS_REGISTRY   Nexus Docker 仓库地址（host[:port][/路径]，如
#                        nexus.example.com:8082 或 nexus.example.com/repository/docker-releases）
#       NEXUS_USERNAME   Nexus 账号
#       NEXUS_PASSWORD   Nexus 密码
#   - 已注册可用的 act_runner
# =====================================================================
name: Docker 镜像构建（Nexus）

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ssh-honeypot-j
  # 自托管 runner 多在国内，注入阿里云 Maven 镜像加速依赖下载（置空可关闭）
  MAVEN_MIRROR: https://repo.pi.mmxx.fun/repository/maven-public
  # buildkit（docker-container driver）拉取镜像不走 docker daemon 的 registry-mirrors，
  # 基础镜像需显式经 Nexus 的 docker 代理仓库拉取，避免 runner 直连 docker.io 超时
  DOCKER_PROXY: repo.pi.mmxx.fun/docker-public
jobs:
  build-and-push:
    name: 构建并推送镜像到 Nexus
    runs-on: nexus
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 提前校验 Secrets，避免构建完成后才因镜像名/登录失败报错
      - name: 检查 Nexus 配置
        shell: bash
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
        run: |
          if [[ -z "$NEXUS_REGISTRY" ]]; then
            echo "::error::未配置 Secret：NEXUS_REGISTRY（Nexus Docker 仓库地址 host[:port][/路径]）"
            exit 1
          fi
          # 镜像 tag 允许 host[:port][/仓库路径]（Nexus 路径式仓库），禁止协议前缀、首尾斜杠、大写字母等，
          # 提前校验避免构建完才报 invalid reference format
          if [[ "$NEXUS_REGISTRY" =~ :// || "$NEXUS_REGISTRY" == /* || "$NEXUS_REGISTRY" == */ || "$NEXUS_REGISTRY" == *//* || -n "${NEXUS_REGISTRY//[a-z0-9._\/:-]/}" ]]; then
            echo "::error::NEXUS_REGISTRY 必须是 host[:port][/路径] 形式（如 nexus.example.com:8082 或 nexus.example.com/repository/docker），不能包含协议前缀、首尾斜杠或大写字母"
            exit 1
          fi
          echo "Nexus 仓库地址：$NEXUS_REGISTRY"

      # 从 tag 解析版本号：release-v1.2.3 -> 1.2.3
      # 无论 tag 推送还是手动选择 tag 触发，只要 ref 以 release-v 开头即解析；
      # 手动选择分支触发时无版本号，仅推 latest
      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            TAG="${GITHUB_REF_NAME#release-v}"
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag 格式必须为 release-vX.Y.Z，实际为：${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "解析出版本号：$TAG"
          fi

      # 仅构建 linux/amd64 单架构，无需 QEMU 跨架构模拟
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        # 若 Nexus 使用自签名证书，取消下面注释并改为实际地址，让 buildkit 放行
        # with:
        #   config-inline: |
        #     [registry."nexus.example.com:8082"]
        #       http = false
        #       insecure = true

      - name: 登录 Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # release-v 开头的 tag（推送或手动选择）：1.2.3、latest；手动选择分支：仅 latest
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.NEXUS_REGISTRY }}/scdm/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAVEN_MIRROR=${{ env.MAVEN_MIRROR }}
            MAVEN_IMAGE=${{ env.DOCKER_PROXY }}/library/maven:3-eclipse-temurin-25
            BASE_IMAGE=${{ env.DOCKER_PROXY }}/library/eclipse-temurin:25-jdk-noble
          # 关闭 provenance 证明，避免部分客户端拉取时出现 unknown digest
          provenance: false
          # 使用 Actions 缓存加速 Maven 依赖层复用
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出推送结果
        shell: bash
        run: |
          echo "已推送镜像："
          echo "${{ steps.meta.outputs.tags }}"
