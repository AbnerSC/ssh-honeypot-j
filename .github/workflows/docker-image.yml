# =====================================================================
# Docker 多架构镜像自动构建发布（linux/amd64 + linux/arm64）
#
# 触发方式：
#   - 推送 v 开头的 tag（如 v1.1.2）自动构建，推送 版本号 + latest 标签
#   - 支持在 Actions 页面手动触发（仅推送 latest）
#
# 推送目标：
#   - Docker Hub（需在仓库 Settings -> Secrets 中配置：
#       DOCKERHUB_USERNAME  Docker Hub 用户名
#       DOCKERHUB_TOKEN     Docker Hub 访问令牌（Account Settings -> Security -> New Access Token））
# =====================================================================
name: Docker 多架构镜像构建

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: ssh-honeypot-j
  IMAGE_USERNAME: scdm

jobs:
  build-and-push:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # arm64 跨架构构建需要 QEMU 模拟（运行阶段 FROM 目标架构基础镜像）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag 推送：v1.1.2、1.1.2、latest；手动触发：仅 latest
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关闭 provenance 证明，避免部分客户端拉取时出现 unknown digest
          provenance: false
          # 使用 GitHub Actions 缓存加速 Maven 依赖层复用
          cache-from: type=gha
          cache-to: type=gha,mode=max