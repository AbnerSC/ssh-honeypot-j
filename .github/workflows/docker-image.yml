# =====================================================================
# Docker 多架构镜像自动构建发布（linux/amd64 + linux/arm64）
#
# 触发方式：
#   - 推送 v 开头的 tag（如 v1.1.2）自动构建，推送 版本号 + latest 标签
#   - 支持在 Actions 页面手动触发（仅推送 latest）
#
# 推送目标：
#   - Docker Hub（需在仓库 Settings -> Secrets 中配置：
#       DOCKERHUB_USERNAME  Docker Hub 用户名
#       DOCKERHUB_TOKEN     Docker Hub 访问令牌（Account Settings -> Security -> New Access Token））
#   - 阿里云容器镜像仓库（需在仓库 Settings -> Secrets 中配置：
#       ALIYUN_CR_USERNAME  阿里云账号（或 RAM 用户）
#       ALIYUN_CR_PASSWORD  ACR 控制台「访问凭证」中设置的固定密码）
#     未配置时自动跳过阿里云推送，仅发布到 Docker Hub
# =====================================================================
name: Docker 多架构镜像构建

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 阿里云容器镜像仓库（registry/namespace 形式，与 pom.xml 保持一致）
  ALIYUN_REGISTRY: crpi-gbejqvtf2wfon7bh.cn-chengdu.personal.cr.aliyuncs.com
  ALIYUN_NAMESPACE: scdm
  IMAGE_NAME: ssh-honeypot-j

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      ALIYUN_USER: ${{ secrets.ALIYUN_CR_USERNAME }}
      ALIYUN_PASS: ${{ secrets.ALIYUN_CR_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录阿里云容器镜像仓库
        if: ${{ env.ALIYUN_USER != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USER }}
          password: ${{ env.ALIYUN_PASS }}

      - name: 计算镜像名称与标签
        id: prep
        shell: bash
        run: |
          # Docker Hub 镜像名：<用户名>/ssh-honeypot-j
          IMAGES="$DOCKERHUB_USER/$IMAGE_NAME"
          if [ -n "$ALIYUN_USER" ]; then
            IMAGES="$IMAGES,$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$IMAGE_NAME"
          fi
          # Tag 触发：版本号（去掉 v 前缀）+ latest；手动触发：仅 latest
          {
            echo "images=$IMAGES"
            echo "tags<<EOF"
            IFS=',' read -ra IMG_ARR <<< "$IMAGES"
            for img in "${IMG_ARR[@]}"; do
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                echo "$img:${GITHUB_REF_NAME#v}"
              fi
              echo "$img:latest"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送多架构镜像（amd64 / arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance 附加产物，保证 manifest 列表在阿里云个人版 ACR 正常落库
          provenance: false
