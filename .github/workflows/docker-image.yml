# =====================================================================
# Docker 多架构镜像自动构建发布（linux/amd64 + linux/arm64）
#
# 触发方式：
#   - 推送 release-v 开头的 tag（如 release-v1.2.3）自动构建，
#     推送 版本号（1.2.3）+ latest 标签
#   - 支持在 Actions 页面手动触发：选择 release-v 开头的 tag 时
#     同样推送 版本号 + latest 标签；选择分支时仅推送 latest
#
# 推送目标：
#   - Docker Hub（需在仓库 Settings -> Secrets 中配置：
#       DOCKERHUB_USERNAME  Docker Hub 用户名
#       DOCKERHUB_TOKEN     Docker Hub 访问令牌（Account Settings -> Security -> New Access Token））
# =====================================================================
name: Docker 多架构镜像构建

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

env:
  IMAGE_NAME: ssh-honeypot-j
  IMAGE_USERNAME: babyfly

jobs:
  build-and-push:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 从 tag 解析版本号：release-v1.2.3 -> 1.2.3
      # 无论 tag 推送还是手动选择 tag 触发，只要 ref 以 release-v 开头即解析；
      # 手动选择分支触发时无版本号，仅推 latest
      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            TAG="${GITHUB_REF_NAME#release-v}"
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag 格式必须为 release-vX.Y.Z，实际为：${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "解析出版本号：$TAG"
          fi

      # arm64 跨架构构建需要 QEMU 模拟（运行阶段 FROM 目标架构基础镜像）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # release-v 开头的 tag（推送或手动选择）：1.2.3、latest；手动选择分支：仅 latest
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关闭 provenance 证明，避免部分客户端拉取时出现 unknown digest
          provenance: false
          # 使用 GitHub Actions 缓存加速 Maven 依赖层复用
          cache-from: type=gha
          cache-to: type=gha,mode=max